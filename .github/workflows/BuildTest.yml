name: dotnet build and test

on:
  push:
    branches:
      - main
      - 'releases/**'
  pull_request:
    branches:
      - main
      - 'releases/**'

env:
  SolutionPath: ./source/BenBurgers.InternationalStandards.sln
  Version: 0.6.${{ github.run_number }}
  DotnetVersion: '9.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET Core SDK ${{ env.DotnetVersion }}
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DotnetVersion }}
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}--nuget
      - name: Install dependencies
        run: dotnet restore ${{ env.SolutionPath }}
      - name: Build
        run: dotnet build ${{ env.SolutionPath }} --configuration Release --no-restore
      - name: Test
        run: dotnet test ${{ env.SolutionPath }} --configuration Test --verbosity normal --logger trx --results-directory "TestResults"
      - name: Upload dotnet test results
        uses: actions/upload-artifact@v3
        with:
          name: dotnet-results
          path: TestResults
        if: ${{ always() }}